name: Bug report
description: A command, the scan or the MCP server did the wrong thing
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The command you ran, and for scan problems a few lines of Lua that show it.
      render: text
    validations: { required: true }
  - type: input
    id: clients
    attributes:
      label: Client(s) and build
      placeholder: "e.g. TBC Anniversary 2.5.6.xxxxx, Retail 12.1.5"
  - type: textarea
    id: status
    attributes:
      label: Output of `wowdev status`
      render: text
