[project]
name = "wow-addon-dev"
version = "0.1.0"
description = "World of Warcraft addon development environment: an MCP server and CLI with every client's API indexed, cross-flavor checks, release tooling and a live game loop"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=2.3,<3",
]

[project.scripts]
wowdev = "wowdev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wowdev"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# `ruff format` owns line length; what it cannot wrap is regex literals
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
