[project]
name = "wow-api-mcp"
version = "0.1.0"
description = "MCP server and toolkit for World of Warcraft addon development: every flavor's API, events, widgets, enums and FrameXML source, indexed"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
]

[project.scripts]
wow-api-mcp = "wow_api_mcp.server:main"
wow-api-build = "wow_api_mcp.build:main"
wow-api-scan = "wow_api_mcp.scan:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wow_api_mcp"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# `ruff format` owns line length; what it cannot wrap is regex literals
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
